name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CGO_ENABLED: "0"
  GOWORK: "off"

jobs:
  # Native amd64 (SSE2 + AVX2, dispatch + Force kernels) and native arm64 (NEON).
  # Both run the differential test/fuzz and gate at 100% Go-statement coverage.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
      - name: vet
        run: go vet ./...
      - name: test with coverage
        run: go test -v -covermode=set -coverprofile=cover.out ./...
      - name: differential fuzz
        run: go test -run '^$' -fuzz '^FuzzXorBlock$' -fuzztime 20s .
      - name: enforce 100% coverage
        run: |
          pct=$(go tool cover -func=cover.out | awk '/^total:/{print $3}' | tr -d '%')
          echo "total coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN{exit (p+0<100.0)?1:0}'

  # The riscv64 RVV, loong64 LSX, ppc64le VSX and s390x vector kernels, each run
  # under QEMU user emulation with the SIMD feature enabled. The riscv64 Force
  # test toggles hasV to also cover the scalar fallback, so a single QEMU run
  # reaches 100%. QEMU_CPU models match the GREEN go-simd/bitset emulated lanes.
  emulated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: riscv64, image: "debian:trixie",                qemu: "rv64,v=true,vlen=128" }
          - { arch: loong64, image: "ghcr.io/loong64/debian:trixie", qemu: "la464" }
          - { arch: ppc64le, image: "debian:trixie",                qemu: "power9" }
          - { arch: s390x,   image: "debian:trixie",                qemu: "qemu" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
      - run: docker run --privileged --rm tonistiigi/binfmt --install all
      - name: build ${{ matrix.arch }} cover binary
        run: GOOS=linux GOARCH=${{ matrix.arch }} go test -c -cover -o /tmp/t.test .
      - name: run under QEMU and gate (100%)
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} \
            -e QEMU_CPU=${{ matrix.qemu }} \
            -v /tmp:/t ${{ matrix.image }} \
            /t/t.test -test.v -test.coverprofile=/t/cov.out
          go tool cover -func=/tmp/cov.out
          pct=$(go tool cover -func=/tmp/cov.out | awk '/^total:/{print $3}')
          echo "coverage=$pct"
          [ "$pct" = "100.0%" ] || { echo "coverage below 100%"; exit 1; }

  # POWER8 ISA-guard lane. The emulated ppc64le job runs the POWER9 model; this
  # lane runs the SAME binary under QEMU_CPU=power8 so an ISA-3.0 op illegal on
  # POWER8 would SIGILL here. The VSX XOR kernel uses only POWER8-baseline
  # LXVD2X/STXVD2X/VXOR, so it must not SIGILL. No coverage gate (contract is
  # "must not SIGILL on POWER8"; 100% is enforced by the POWER9 lane).
  emulated-ppc64le-power8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
      - run: docker run --privileged --rm tonistiigi/binfmt --install all
      - run: GOOS=linux GOARCH=ppc64le go test -c -cover -o /tmp/t.test .
      - name: run ppc64le binary on POWER8 (must not SIGILL)
        run: docker run --rm --platform linux/ppc64le -e QEMU_CPU=power8 -v /tmp:/t debian:trixie /t/t.test -test.v

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: linux, goarch: riscv64}
          - {goos: linux, goarch: ppc64le}
          - {goos: linux, goarch: s390x}
          - {goos: linux, goarch: loong64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
      - name: build ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        run: go build ./...
